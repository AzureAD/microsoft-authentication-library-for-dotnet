# template-build-on-mac.yaml
# Build tests\devapps\MacConsoleAppWithBroker\MacConsoleAppWithBroker.csproj on macOS

parameters:
  BuildConfiguration: 'Release'
  MacWorkloadSetVersion: '10.0.202'

steps:

- task: NuGetToolInstaller@0
  displayName: 'Use latest NuGet'
  inputs:
    versionSpec: 6.x

- task: UseDotNet@2
  displayName: 'Use the latest .NET 10'
  inputs:
    version: 10.x

- task: Bash@3
  displayName: 'Select Xcode 26.3 for the pinned .NET 10 Apple workload'
  inputs:
    targetType: 'inline'
    script: |
      set -euo pipefail
      # Workload set 10.0.202 requires Xcode 26.3, available on the macOS 15 image.
      sudo xcode-select --switch /Applications/Xcode_26.3.app/Contents/Developer
      xcodebuild -version

- task: DotNetCoreCLI@2
  displayName: 'Restore mac console app with broker'
  inputs:
    command: 'custom'
    custom: 'workload'
    arguments: 'restore ./tests/devapps/MacConsoleAppWithBroker/MacConsoleAppWithBroker.csproj --version ${{ parameters.MacWorkloadSetVersion }}'

- task: DotNetCoreCLI@2
  displayName: 'Build mac console app with broker'
  inputs:
    command: 'build'
    projects: |
      ./tests/devapps/MacConsoleAppWithBroker/MacConsoleAppWithBroker.csproj

- task: DotNetCoreCLI@2
  displayName: 'Restore .NET 10 Mac MAUI workload'
  inputs:
    command: 'custom'
    custom: 'workload'
    arguments: 'restore ./tests/devapps/MacMauiAppWithBroker/MacMauiAppWithBroker.csproj --version ${{ parameters.MacWorkloadSetVersion }}'

- task: DotNetCoreCLI@2
  displayName: 'Build .NET 10 Mac MAUI app'
  inputs:
    command: 'build'
    projects: './tests/devapps/MacMauiAppWithBroker/MacMauiAppWithBroker.csproj'
    arguments: >
      --configuration ${{ parameters.BuildConfiguration }}
      --framework net10.0-maccatalyst
      /p:EnableCodeSigning=false
