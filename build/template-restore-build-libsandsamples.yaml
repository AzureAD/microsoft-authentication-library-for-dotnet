# template-restore-build-libsandsamples.yaml
# Performs Nuget Restore and Build of LibsAndSamples.sln based on BuildPlatform and BuildConfiguration

parameters:
  Solution: 'LibsAndSamples.sdk.slnf'
  BuildPlatform: 'any cpu'
  BuildConfiguration: 'Release'
  MicrosoftIdentityClientVersion: '4.60.0-devopsbuild'
  LabApiVersion: '2.0.0-devopsbuild'

steps:

- task: CmdLine@2
  displayName: 'Clear local NuGet cache'
  inputs:
    script: 'nuget locals all -clear'

- task: PowerShell@2
  displayName: 'dotnet workload restore for Desktop project'
  inputs:
    targetType: 'inline'
    pwsh: true
    script: |
      dotnet workload restore .\src\client\Microsoft.Identity.Client.Desktop\Microsoft.Identity.Client.Desktop.csproj
      $exitCode = $LASTEXITCODE
      if ($exitCode -ne 0) {
          Write-Host "##vso[task.logissue type=error;]Desktop workload restore failed (exit $exitCode)."
          exit $exitCode
      }

- task: PowerShell@2
  displayName: 'dotnet workload restore'
  inputs:
    targetType: 'inline'
    pwsh: true
    script: |
      dotnet workload restore .\src\client\Microsoft.Identity.Client\Microsoft.Identity.Client.csproj
      $exitCode = $LASTEXITCODE
      if ($exitCode -ne 0) {
          Write-Host "##vso[task.logissue type=error;]Core workload restore failed (exit $exitCode)."
          exit $exitCode
      }

- task: Bash@3
  displayName: Install MAUI
  inputs:
    targetType: 'inline'
    script: |
      dotnet workload install android ios macos maui --source https://api.nuget.org/v3/index.json

- task: DotNetCoreCLI@2
  displayName: 'NuGet restore ${{ parameters.Solution }}'
  inputs:
    command: 'restore'
    projects: '${{ parameters.Solution }}'
    selectOrConfig: 'config'
    nugetConfigPath: 'NuGet.Config'
    restoreArguments: >
      /p:Platform="${{ parameters.BuildPlatform }}"
      /p:Configuration="${{ parameters.BuildConfiguration }}"

- task: DotNetCoreCLI@2
  displayName: 'Build solution ${{ parameters.Solution }}'
  inputs:
    command: 'build'
    projects: '${{ parameters.Solution }}'
    arguments: >
      --no-restore
      /m
      /p:Platform="${{ parameters.BuildPlatform }}"
      /p:Configuration="${{ parameters.BuildConfiguration }}"
      /p:RunCodeAnalysis=false
      /p:MicrosoftIdentityClientVersion=${{ parameters.MicrosoftIdentityClientVersion }}
      /p:LabApiVersion=${{ parameters.LabApiVersion }}
      /p:SourceLinkCreate=true
      /p:ContinousIntegrationBuild=true
