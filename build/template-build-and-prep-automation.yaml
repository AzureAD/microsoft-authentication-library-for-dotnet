steps:
# Install NuGet
- task: NuGetToolInstaller@0
  displayName: 'Use latest NuGet'
  inputs:
    versionSpec: 6.x

- task: UseDotNet@2
  displayName: 'Use the latest .NET 10'
  inputs:
    version: 10.x

# Nuget Restore and Build 
- template: template-restore-build-libsandsamples.yaml
  parameters:
    BuildPlatform: '$(BuildPlatform)'
    BuildConfiguration: '$(BuildConfiguration)'
    MicrosoftIdentityClientVersion: $(MicrosoftIdentityClientVersion)
    LabApiVersion: $(LabApiVersion)
    Solution: 'LibsAndSamples.sdk.slnf'

# The solution's Release|Any CPU configuration skips this app.
- task: DotNetCoreCLI@2
  displayName: 'Build .NET 10 WAM MAUI app'
  inputs:
    command: 'build'
    projects: 'tests\devapps\WAM\WAMMauiApp\WAMMauiApp\WAMMauiApp.csproj'
    arguments: >
      --configuration "$(BuildConfiguration)"
      /p:MicrosoftIdentityClientVersion=$(MicrosoftIdentityClientVersion)
      /p:LabApiVersion=$(LabApiVersion)
      /p:RunCodeAnalysis=false

- task: UseDotNet@2
  displayName: 'Install .NET 8 package-consumer test runtime'
  inputs:
    packageType: runtime
    version: 8.x

- task: UseDotNet@2
  displayName: 'Install .NET 9 package-consumer test runtime'
  inputs:
    packageType: runtime
    version: 9.x

- task: DotNetCoreCLI@2
  displayName: 'Pack MSAL for older-runtime consumer regressions'
  inputs:
    command: 'custom'
    custom: 'msbuild'
    arguments: >
      src\client\Microsoft.Identity.Client\Microsoft.Identity.Client.csproj
      /t:Pack
      /p:Configuration="$(BuildConfiguration)"
      /p:NoBuild=true
      /p:NoRestore=true
      /p:PackageVersion=0.0.0-compat.$(Build.BuildId)
      /p:PackageOutputPath="$(Agent.TempDirectory)\msal-compatibility-packages"
      /p:MicrosoftIdentityClientVersion=$(MicrosoftIdentityClientVersion)

- task: DotNetCoreCLI@2
  displayName: 'Test packaged compatibility asset on .NET 8 and .NET 9'
  inputs:
    command: 'test'
    projects: 'tests\Microsoft.Identity.Test.Compatibility\Microsoft.Identity.Test.Compatibility.csproj'
    arguments: >
      --configuration "$(BuildConfiguration)"
      /p:MsalCompatibilityPackageVersion=0.0.0-compat.$(Build.BuildId)
      /p:RestoreAdditionalProjectSources="$(Agent.TempDirectory)\msal-compatibility-packages"

- task: PowerShell@2
  displayName: 'Annotate failed package-consumer regressions'
  condition: failed()
  inputs:
    targetType: 'inline'
    pwsh: true
    script: |
      $ErrorActionPreference = 'Stop'
      foreach ($file in Get-ChildItem -LiteralPath '$(Agent.TempDirectory)' -Filter '*.trx' -File) {
          [xml]$results = Get-Content -LiteralPath $file.FullName -Raw
          foreach ($result in $results.TestRun.Results.UnitTestResult) {
              if ($result.outcome -eq 'Failed' -and
                  $result.testName -match '^(OlderRuntimeSelectsNonExportingCompatibilityAsset|AttachedNonExportableKeySignsAfterOriginalKeyIsDisposed|FamilyRefreshPreservesServiceErrorsExceptClientMismatchAsync|WinUIWindowIsRetainedAsInteractiveOwner|ReleasedWinUICoreTypesResolveAndSchedulerRunsOnStaAsync)( \(|$)') {
                  $message = "$($result.testName): $($result.Output.ErrorInfo.Message)"
                  $message = $message.Replace('%', '%AZP25').Replace("`r", '%0D').Replace("`n", '%0A')
                  Write-Host "##vso[task.logissue type=error;]$message"
              }
          }
      }

- task: CopyFiles@2
  displayName: 'Stage MSAL src'
  inputs:
    SourceFolder: src\client
    Contents: '**\**.cs'
    TargetFolder: '$(build.artifactstagingdirectory)/msalSrc'

- task: CopyFiles@2
  displayName: 'Stage MSAL src bin'
  inputs:
    SourceFolder: src\client
    Contents: '**\bin\**\*'
    TargetFolder: '$(build.artifactstagingdirectory)/msalSrc'

- task: CopyFiles@2
  displayName: 'Stage MSAL tests'
  inputs:
    SourceFolder: tests
    Contents: 'Microsoft.Identity**\bin\**\**'
    TargetFolder: '$(build.artifactstagingdirectory)/msalTests'

- task: CopyFiles@2
  displayName: 'Stage CacheCompat tests'
  inputs:
    SourceFolder: tests\CacheCompat
    Contents: '**\bin\**\**'
    TargetFolder: '$(build.artifactstagingdirectory)/cacheCompatTests'

- task: CopyFiles@2
  displayName: 'Copy WAM DevApp Dlls'
  inputs:
    SourceFolder: tests/devapps/wam
    Contents: '**/bin/**/**'
    TargetFolder: '$(Build.SourcesDirectory)/WAM'

- task: CopyFiles@2
  displayName: 'Copy Managed Identity DevApp Dlls'
  inputs:
    SourceFolder: 'tests\devapps\Managed Identity apps\ManagedIdentityAppVM'
    Contents: '**\bin\**\*'
    TargetFolder: '$(Build.SourcesDirectory)/ManagedIdentityAppVM'

- task: PublishPipelineArtifact@1
  displayName: 'Publish Artifact: drop'
  inputs:
    targetPath: $(Build.artifactstagingdirectory)
    artifactName: drop

- task: PowerShell@2
  displayName: 'Verify Existence of Runtime Dlls'
  inputs:
    targetType: 'inline'
    script: |
        #Search Folder
        $searchInFolder = "\WAM\";
        $searchInFolder = Join-Path $(Build.SourcesDirectory) $searchInFolder 

        Write-Host $searchInFolder 

        #runtime path with file name
        $runtimes = @('runtimes\win-x64\native\msalruntime.dll', 
                      'runtimes\win-x86\native\msalruntime_x86.dll', 
                      'runtimes\win-arm64\native\msalruntime_arm64.dll');

        #dev apps to check
        $AppsToCheck = @('NetCoreWinFormsWam\bin\Release\net10.0-windows10.0.17763.0\');

        #Check if runtime files for each arch exist in the Dev Apps for any CPU 
        $errors = '';

        foreach ($runtime in $runtimes) 
        {
            foreach ($app in $AppsToCheck) 
            {
                $appFullPath = $searchInFolder+$app+$runtime
                
                Write-Host $appFullPath
                
                if (-not(Test-Path -Path $appFullPath -PathType Leaf))
                 {
                      $errors += "Failed to find runtime files in : " + $SearchInFolder + $app + "`n";
                 }
            }
        }

        #check Linux runtime files
        $linuxRuntimes = 'runtimes\linux-x64\native\libmsalruntime.so';
        $LinuxAppsToCheck = 'NetWSLWam\bin\Release\net10.0\';
        $appFullPath = $searchInFolder+$LinuxAppsToCheck+$linuxRuntimes
        Write-Host $appFullPath
        if (-not(Test-Path -Path $appFullPath -PathType Leaf))
        {
            $errors += "Failed to find Linux runtime files in : " + $SearchInFolder + $app + "`n";
        }

        # Managed Identity app runtime DLL check
        $managedIdentityFolder = Join-Path $(Build.SourcesDirectory) 'ManagedIdentityAppVM'
        $managedIdentityDll = Join-Path $managedIdentityFolder 'bin\Release\net10.0\runtimes\win-x64\native\AttestationClientLib.dll'
        
        Write-Host "Checking: $managedIdentityDll"
        if (-not (Test-Path -Path $managedIdentityDll -PathType Leaf))
        {
            $errors += "Failed to find AttestationClientLib.dll at: $managedIdentityDll`n"
        }

        #exit if there are errors
        IF (![string]::IsNullOrWhitespace($errors))
        {
            Write-Host $errors;
            echo "##vso[task.logissue type=error]Verify Existence of Runtime Dlls Task Failed."
            echo "##vso[task.complete result=Failed;]Failed"
        }
        Else
        {
            Write-Host "File check complete. All msalruntime dlls are present."
        }
