
parameters:
  BuildConfiguration: 'release'
  ProjectRootPath: ''
  AssemblyName: ''
  NoBuild: 'true'

steps:

- task: onebranch.pipeline.signing@1
  displayName: 'Sign ${{ parameters.LibraryName }} with OneBranch'
  inputs:
    command: 'sign'
    signing_profile: 'external_distribution' #CP-230012 -> https://eng.ms/docs/products/onebranch/signing/containerbuildsigning#signing-using-onebranchpipelinesigning-ado-task
    files_to_sign: '**\bin\**\${{ parameters.AssemblyName }}.dll'
    search_root: '${{ parameters.ProjectRootPath }}\${{ parameters.AssemblyName }}'
  condition: and(succeeded(), eq(variables['PipelineType'], 'OneBranch'))

- task: DotNetCoreCLI@2
  displayName: 'Pack ${{ parameters.ProjectPath }}'
  inputs:
    command: 'custom'
    custom: 'msbuild'
    arguments: >
      "${{ parameters.ProjectRootPath }}\${{ parameters.AssemblyName }}\${{ parameters.AssemblyName }}.csproj"
      /t:pack
      /p:NoBuild=${{ parameters.NoBuild }}
      /p:IncludeSymbols=true
      /p:Configuration=${{ parameters.BuildConfiguration }}

- ${{ if eq(parameters.AssemblyName, 'Microsoft.Identity.Client') }}:
  - task: PowerShell@2
    displayName: 'Combine and validate .NET 8/.NET 10 mobile package assets'
    inputs:
      targetType: filePath
      filePath: '${{ parameters.ProjectRootPath }}/../../build/merge-net8-mobile-packages.ps1'
      arguments: >
        -ProjectDirectory "${{ parameters.ProjectRootPath }}/${{ parameters.AssemblyName }}"
        -BuildConfiguration "${{ parameters.BuildConfiguration }}"
      pwsh: true
